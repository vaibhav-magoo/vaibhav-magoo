<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="100%" height="100%">
  <defs>
    <linearGradient id="footCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D11" />
      <stop offset="50%" stop-color="#08080B" />
      <stop offset="100%" stop-color="#0D0D11" />
    </linearGradient>

    <linearGradient id="footRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Plus Jakarta Sans', sans-serif;
    }
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
    }
    @keyframes pulseBeacon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .beacon { animation: pulseBeacon 2.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon { animation: none !important; }
    }
  </style>

  <!-- Double-Bezel Outer Shell -->
  <rect x="1" y="1" width="1198" height="102" rx="26" fill="#050507" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
  <!-- Double-Bezel Inner Core -->
  <rect x="7" y="7" width="1186" height="90" rx="20" fill="url(#footCore)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
  <line x1="120" y1="7.5" x2="1080" y2="7.5" stroke="url(#footRim)" stroke-width="1" />

  <!-- Left Identity & Philosophy -->
  <g transform="translate(36, 44)">
    <circle cx="8" cy="-4" r="4" fill="#10B981" class="beacon" />
    <text x="24" y="0" fill="#F4F4F5" font-size="14" font-weight="600" letter-spacing="-0.2" class="display">
      Vaibhav Magoo
    </text>
    <text x="136" y="0" fill="#52525B" font-size="13" class="mono">/</text>
    <text x="152" y="0" fill="#A1A1AA" font-size="13.5" class="display">
      Available for architectural discussions, product engineering &amp; technical collaborations.
    </text>
    <text x="24" y="24" fill="#71717A" font-size="11.5" class="mono">
      Engineered with precision · Respects prefers-reduced-motion
    </text>
  </g>

  <!-- Right "Button-in-Button" Island CTA -->
  <g transform="translate(972, 32)">
    <rect x="0" y="0" width="188" height="40" rx="20" fill="#16161D" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="22" y="24.5" fill="#F4F4F5" font-size="12.5" font-weight="500" class="display">
      unistack.cc
    </text>
    <circle cx="164" cy="20" r="14" fill="#FFFFFF" fill-opacity="0.08" />
    <path d="M 160 24 L 168 16 M 162 16 L 168 16 L 168 22" fill="none" stroke="#F4F4F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
