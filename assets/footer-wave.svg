<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 126" width="100%" height="100%">
  <defs>
    <linearGradient id="footCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#040406" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="footRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Inter', sans-serif;
    }
    .serif {
      font-family: 'Playfair Display', 'PP Editorial New', 'Instrument Serif', Georgia, serif;
    }
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
    }
    @keyframes starRotate {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(0.75); opacity: 0.4; }
    }
    .star {
      transform-origin: 600px 63px;
      animation: starRotate 3.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none !important; }
    }
  </style>

  <!-- Double-Bezel Outer Shell -->
  <rect x="1" y="1" width="1198" height="124" rx="26" fill="#020203" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
  <!-- Double-Bezel Inner Core -->
  <rect x="7" y="7" width="1186" height="112" rx="20" fill="url(#footCore)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
  <line x1="140" y1="7.5" x2="1060" y2="7.5" stroke="url(#footRim)" stroke-width="1" />

  <!-- Top Hairline Rule -->
  <line x1="340" y1="32" x2="860" y2="32" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />

  <!-- Left Filigree Flourish (Reference 3 Homage) -->
  <path d="M 270 63 C 288 53, 304 73, 322 63 C 332 57, 342 63, 350 63" fill="none" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round" />
  <circle cx="266" cy="63" r="1.8" fill="#A1A1AA" fill-opacity="0.6" />

  <!-- Center Spaced Colophon Typography -->
  <text x="455" y="67" text-anchor="middle" fill="#D4D4D8" font-size="12" letter-spacing="3.2" class="serif">
    vaibhav magoo
  </text>

  <text x="546" y="67" text-anchor="middle" fill="#52525B" font-size="12" class="mono">/</text>

  <!-- 4-Point Star Ornament -->
  <path d="M 600 56 Q 600 63 607 63 Q 600 63 600 70 Q 600 63 593 63 Q 600 63 600 56 Z" fill="#FFFFFF" class="star" />

  <text x="654" y="67" text-anchor="middle" fill="#52525B" font-size="12" class="mono">/</text>

  <text x="752" y="67" text-anchor="middle" fill="#D4D4D8" font-size="11.5" letter-spacing="2.8" class="mono">
    unistack.cc · ist
  </text>

  <!-- Right Filigree Flourish -->
  <path d="M 850 63 C 858 63, 868 57, 878 63 C 896 73, 912 53, 930 63" fill="none" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round" />
  <circle cx="934" cy="63" r="1.8" fill="#A1A1AA" fill-opacity="0.6" />

  <!-- Bottom Hairline Rule -->
  <line x1="340" y1="94" x2="860" y2="94" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
</svg>
