<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 54" width="100%" height="100%">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040405" />
      <stop offset="50%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020203" stop-opacity="1" />
      <stop offset="10%" stop-color="#020203" stop-opacity="0" />
      <stop offset="90%" stop-color="#020203" stop-opacity="0" />
      <stop offset="100%" stop-color="#020203" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="topSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    @keyframes glide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1440px); }
    }
    .track {
      animation: glide 36s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .track { animation: none !important; }
    }
  </style>

  <!-- Double-Bezel Outer Pill -->
  <rect x="1" y="1" width="1198" height="52" rx="26" fill="#020203" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
  <rect x="5" y="5" width="1190" height="44" rx="22" fill="url(#stripBg)" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
  <line x1="160" y1="5.5" x2="1040" y2="5.5" stroke="url(#topSpecular)" stroke-width="1" />

  <!-- Continuous Gliding Track (1440px period) -->
  <g class="track" transform="translate(0, 31)">
    <!-- Segment A -->
    <g transform="translate(40, 0)">
      <text x="0" y="0" fill="#FFFFFF" class="mono">NEXT.JS</text>
      <rect x="92" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="118" y="0" fill="#A1A1AA" class="mono">TYPESCRIPT</text>
      <rect x="242" y="-7" width="4" height="4" fill="#52525B" />
      <text x="268" y="0" fill="#FFFFFF" class="mono">PYTHON &amp; FASTAPI</text>
      <rect x="448" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="474" y="0" fill="#A1A1AA" class="mono">THREE.JS &amp; WEBGL</text>
      <rect x="652" y="-7" width="4" height="4" fill="#52525B" />
      <text x="678" y="0" fill="#FFFFFF" class="mono">ELECTRON DESKTOP</text>
      <rect x="866" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="892" y="0" fill="#A1A1AA" class="mono">VAPI VOICE AGENTS</text>
      <rect x="1084" y="-7" width="4" height="4" fill="#52525B" />
      <text x="1110" y="0" fill="#FFFFFF" class="mono">SUPABASE &amp; PAYLOAD</text>
      <rect x="1312" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="1338" y="0" fill="#A1A1AA" class="mono">DOCKER SDK</text>
    </g>

    <!-- Segment B (+1440px) -->
    <g transform="translate(1480, 0)">
      <text x="0" y="0" fill="#FFFFFF" class="mono">NEXT.JS</text>
      <rect x="92" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="118" y="0" fill="#A1A1AA" class="mono">TYPESCRIPT</text>
      <rect x="242" y="-7" width="4" height="4" fill="#52525B" />
      <text x="268" y="0" fill="#FFFFFF" class="mono">PYTHON &amp; FASTAPI</text>
      <rect x="448" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="474" y="0" fill="#A1A1AA" class="mono">THREE.JS &amp; WEBGL</text>
      <rect x="652" y="-7" width="4" height="4" fill="#52525B" />
      <text x="678" y="0" fill="#FFFFFF" class="mono">ELECTRON DESKTOP</text>
      <rect x="866" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="892" y="0" fill="#A1A1AA" class="mono">VAPI VOICE AGENTS</text>
      <rect x="1084" y="-7" width="4" height="4" fill="#52525B" />
      <text x="1110" y="0" fill="#FFFFFF" class="mono">SUPABASE &amp; PAYLOAD</text>
      <rect x="1312" y="-7" width="4" height="4" fill="#FFFFFF" />
      <text x="1338" y="0" fill="#A1A1AA" class="mono">DOCKER SDK</text>
    </g>
  </g>

  <!-- Soft Edge Vignette -->
  <rect x="5" y="5" width="1190" height="44" rx="22" fill="url(#fadeMask)" pointer-events="none" />
</svg>
