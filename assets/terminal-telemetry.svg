<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes pulseWidth1 {
      0%, 100% { width: 395px; }
      50% { width: 410px; }
    }
    @keyframes pulseWidth2 {
      0%, 100% { width: 380px; }
      50% { width: 398px; }
    }
    @keyframes pulseWidth3 {
      0%, 100% { width: 365px; }
      50% { width: 385px; }
    }
    @keyframes pulseWidth4 {
      0%, 100% { width: 350px; }
      50% { width: 372px; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .fill-1 { animation: pulseWidth1 4s ease-in-out infinite; }
    .fill-2 { animation: pulseWidth2 4.5s ease-in-out infinite; }
    .fill-3 { animation: pulseWidth3 3.8s ease-in-out infinite; }
    .fill-4 { animation: pulseWidth4 5s ease-in-out infinite; }
    .blink { animation: cursorBlink 1s infinite; }
  </style>

  <!-- Main Window Frame -->
  <rect width="1200" height="310" rx="16" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.8" />

  <!-- Window Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 1184 0 Q 1200 0 1200 16 L 1200 42 L 0 42 Z" fill="#0F172A" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- macOS Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <text x="600" y="25" text-anchor="middle" fill="#64748B" font-size="12.5" font-weight="600" class="mono">
    vaibhav@arch-node: ~/telemetry/builder-profile.yaml — zsh
  </text>

  <!-- Vertical Divider -->
  <line x1="635" y1="58" x2="635" y2="290" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- LEFT PANE: Interactive Config & Philosophy -->
  <g transform="translate(28, 72)" class="mono" font-size="13.5">
    <text x="0" y="0" fill="#38BDF8" font-weight="700">❯ cat builder_manifest.yaml</text>

    <text x="0" y="30" fill="#94A3B8">engineer:</text>
    <text x="90" y="30" fill="#F8FAFC" font-weight="600">"Vaibhav Magoo"</text>

    <text x="0" y="54" fill="#94A3B8">architecture_focus:</text>
    <text x="16" y="78" fill="#10B981">- "AI Agents that fit into real human workflows"</text>
    <text x="16" y="100" fill="#38BDF8">- "Full-stack platforms with deep admin &amp; ops planes"</text>
    <text x="16" y="122" fill="#C084FC">- "Developer tools, IDE extensions &amp; automation engines"</text>
    <text x="16" y="144" fill="#FBBF24">- "Expressive 3D / WebGL &amp; clean operator interfaces"</text>

    <text x="0" y="174" fill="#94A3B8">repo_visibility_note:</text>
    <text x="16" y="196" fill="#64748B" font-size="12.5">"Production systems live in private repos; always happy to"</text>
    <text x="16" y="214" fill="#64748B" font-size="12.5">"discuss system design, trade-offs &amp; product engineering."</text>
    <rect x="466" y="202" width="8" height="15" fill="#10B981" class="blink" />
  </g>

  <!-- RIGHT PANE: Animated System Domain Meters -->
  <g transform="translate(668, 72)">
    <text x="0" y="0" fill="#E2E8F0" font-size="13.5" font-weight="700" class="mono">
      ⚡ CORE ENGINEERING TELEMETRY
    </text>

    <!-- Meter 1 -->
    <g transform="translate(0, 22)">
      <text x="0" y="14" fill="#CBD5E1" font-size="12.5" font-weight="600" class="sans">Full-Stack Web &amp; Product Architecture</text>
      <text x="495" y="14" text-anchor="end" fill="#38BDF8" font-size="12" font-weight="700" class="mono">96%</text>
      <rect x="0" y="22" width="495" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="22" width="395" height="10" rx="5" fill="url(#barCyan)" class="fill-1" />
    </g>

    <!-- Meter 2 -->
    <g transform="translate(0, 72)">
      <text x="0" y="14" fill="#CBD5E1" font-size="12.5" font-weight="600" class="sans">AI Workflows, Voice Agents &amp; LLM Integrations</text>
      <text x="495" y="14" text-anchor="end" fill="#C084FC" font-size="12" font-weight="700" class="mono">94%</text>
      <rect x="0" y="22" width="495" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="22" width="380" height="10" rx="5" fill="url(#barPurple)" class="fill-2" />
    </g>

    <!-- Meter 3 -->
    <g transform="translate(0, 122)">
      <text x="0" y="14" fill="#CBD5E1" font-size="12.5" font-weight="600" class="sans">Backend APIs, Schemas &amp; Cloud/Docker Ops</text>
      <text x="495" y="14" text-anchor="end" fill="#34D399" font-size="12" font-weight="700" class="mono">91%</text>
      <rect x="0" y="22" width="495" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="22" width="365" height="10" rx="5" fill="url(#barGreen)" class="fill-3" />
    </g>

    <!-- Meter 4 -->
    <g transform="translate(0, 172)">
      <text x="0" y="14" fill="#CBD5E1" font-size="12.5" font-weight="600" class="sans">3D Desktop Companions &amp; Developer Tooling</text>
      <text x="495" y="14" text-anchor="end" fill="#FBBF24" font-size="12" font-weight="700" class="mono">89%</text>
      <rect x="0" y="22" width="495" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="22" width="350" height="10" rx="5" fill="url(#barAmber)" class="fill-4" />
    </g>
  </g>
</svg>
