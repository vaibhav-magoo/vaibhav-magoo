<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <linearGradient id="winCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>

    <linearGradient id="winRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181F" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>
  </defs>

  <style>
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Plus Jakarta Sans', sans-serif;
    }
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
    }
    @keyframes caretPulse {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .caret { animation: caretPulse 1.1s infinite; }
    .node { animation: nodePulse 2.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .caret, .node { animation: none !important; }
    }
  </style>

  <!-- Double-Bezel Outer Shell -->
  <rect x="1" y="1" width="1198" height="288" rx="26" fill="#050507" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Double-Bezel Inner Core -->
  <rect x="8" y="8" width="1184" height="274" rx="20" fill="url(#winCore)" stroke="url(#winRim)" stroke-width="1" />
  <line x1="60" y1="8.5" x2="1140" y2="8.5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" />

  <!-- macOS Chrome Header -->
  <line x1="8" y1="46" x2="1192" y2="46" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="30" cy="27" r="5.5" fill="#27272A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
  <circle cx="48" cy="27" r="5.5" fill="#27272A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
  <circle cx="66" cy="27" r="5.5" fill="#27272A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />

  <text x="600" y="31" text-anchor="middle" fill="#71717A" font-size="11.5" font-weight="500" letter-spacing="0.5" class="mono">
    architecture.manifest.ts — vaibhav-magoo
  </text>

  <!-- Center Vertical Hairline Divider -->
  <line x1="620" y1="46" x2="620" y2="282" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <!-- LEFT PANE: Clean TypeScript Manifest -->
  <g transform="translate(34, 78)" class="mono" font-size="13">
    <text x="0" y="0" fill="#52525B">01</text>
    <text x="32" y="0" fill="#A855F7">export const</text>
    <text x="134" y="0" fill="#F4F4F5">engineeringPrinciples</text>
    <text x="308" y="0" fill="#71717A">= {</text>

    <text x="0" y="28" fill="#52525B">02</text>
    <text x="48" y="28" fill="#A1A1AA">aiWorkflows:</text>
    <text x="156" y="28" fill="#38BDF8">"Agents embedded into real operator workflows"</text>

    <text x="0" y="54" fill="#52525B">03</text>
    <text x="48" y="54" fill="#A1A1AA">productDepth:</text>
    <text x="164" y="54" fill="#10B981">"End-to-end systems with deep admin planes"</text>

    <text x="0" y="80" fill="#52525B">04</text>
    <text x="48" y="80" fill="#A1A1AA">craftsmanship:</text>
    <text x="168" y="80" fill="#F59E0B">"Fluid 3D interfaces &amp; zero-friction tooling"</text>

    <text x="0" y="106" fill="#52525B">05</text>
    <text x="48" y="106" fill="#A1A1AA">repositories:</text>
    <text x="160" y="106" fill="#E4E4E7">"Production in private · Open R&amp;D in public"</text>

    <text x="0" y="134" fill="#52525B">06</text>
    <text x="32" y="134" fill="#71717A">} as const;</text>
    <rect x="122" y="121" width="7" height="15" fill="#38BDF8" class="caret" />

    <!-- Bottom Note -->
    <text x="0" y="176" fill="#71717A" font-size="11.5">
      // Happy to walk through system architecture &amp; engineering decisions.
    </text>
  </g>

  <!-- RIGHT PANE: System Architecture Pillars (Clean Hardware Modules) -->
  <g transform="translate(652, 72)">
    <text x="0" y="6" fill="#71717A" font-size="10.5" font-weight="600" letter-spacing="1.6" class="mono">
      SYSTEM ARCHITECTURE DOMAINS
    </text>

    <!-- Domain 1 -->
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="508" height="40" rx="10" fill="url(#pillGrad)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <circle cx="18" cy="20" r="3.5" fill="#38BDF8" class="node" />
      <text x="34" y="24" fill="#F4F4F5" font-size="13" font-weight="500" class="display">Full-Stack Web &amp; Multi-Tenant Platforms</text>
      <text x="490" y="24" text-anchor="end" fill="#71717A" font-size="11" class="mono">Next.js · TS</text>
    </g>

    <!-- Domain 2 -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="508" height="40" rx="10" fill="url(#pillGrad)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <circle cx="18" cy="20" r="3.5" fill="#A855F7" class="node" />
      <text x="34" y="24" fill="#F4F4F5" font-size="13" font-weight="500" class="display">Voice AI Pipelines &amp; Document Engines</text>
      <text x="490" y="24" text-anchor="end" fill="#71717A" font-size="11" class="mono">Vapi · FastAPI</text>
    </g>

    <!-- Domain 3 -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="508" height="40" rx="10" fill="url(#pillGrad)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <circle cx="18" cy="20" r="3.5" fill="#F59E0B" class="node" />
      <text x="34" y="24" fill="#F4F4F5" font-size="13" font-weight="500" class="display">3D Desktop Companions &amp; Motion Studios</text>
      <text x="490" y="24" text-anchor="end" fill="#71717A" font-size="11" class="mono">Electron · WebGL</text>
    </g>

    <!-- Domain 4 -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="508" height="40" rx="10" fill="url(#pillGrad)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <circle cx="18" cy="20" r="3.5" fill="#10B981" class="node" />
      <text x="34" y="24" fill="#F4F4F5" font-size="13" font-weight="500" class="display">Container Control Planes &amp; IDE Tooling</text>
      <text x="490" y="24" text-anchor="end" fill="#71717A" font-size="11" class="mono">Docker · Python</text>
    </g>
  </g>
</svg>
