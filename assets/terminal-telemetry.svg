<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" height="100%">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0F" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#0C0C0E" />
    </linearGradient>
    <linearGradient id="topSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Inter', sans-serif;
    }
    .serif {
      font-family: 'Playfair Display', 'PP Editorial New', 'Instrument Serif', Georgia, serif;
    }
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', 'Courier New', monospace;
    }
    .ascii {
      font-family: 'Courier New', 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 9.8px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }

    @keyframes floatBird {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseAscii {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .bird-group {
      animation: floatBird 7s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .ascii-shimmer {
      animation: pulseAscii 3.4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .bird-group, .ascii-shimmer { animation: none !important; }
    }
  </style>

  <!-- Double-Bezel Outer Frame -->
  <rect x="1" y="1" width="1198" height="488" rx="26" fill="#040405" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
  <rect x="8" y="8" width="1184" height="474" rx="20" fill="url(#posterBg)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
  <line x1="120" y1="8.5" x2="1080" y2="8.5" stroke="url(#topSpec)" stroke-width="1" />

  <!-- ==================== RIGHT SIDE: CALLIGRAPHIC ASCII PHOENIX ARTWORK ==================== -->
  <g class="bird-group">
    <g class="ascii" fill="#D4D4D8" fill-opacity="0.88">
      <text x="485" y="84.8" xml:space="preserve">         ..  :                                                 ..   .         </text>
      <text x="485" y="95.0" xml:space="preserve">     .....:::.....                                             :.....         </text>
      <text x="485" y="105.2" xml:space="preserve">      ..::::::::     ...                                     .:~~~!!~:        </text>
      <text x="485" y="115.4" xml:space="preserve">     .:::.::....:..  ...:::...                             :~~!~!!!!!!~.      </text>
      <text x="485" y="125.6" xml:space="preserve">     .~:.::::....:.................                       :~~!!~~:~!!!~:      </text>
      <text x="485" y="135.8" xml:space="preserve">     :::::~:::::::::::::~~~::~::~~~~:   ..::..           :!7!~~~~~!!!!~~:     </text>
      <text x="485" y="146.0" xml:space="preserve">      .::~~:::~:~:::::::~:::::::::~!!!!77????!~:.       :!!!~~~~~~!!!!!!~     </text>
      <text x="485" y="156.2" xml:space="preserve">      ..::~~~~~~~::::::::~:::::::::~!!!77!7!~:::.      :~~!!~~~!!!!!!!!7~     </text>
      <text x="485" y="166.4" xml:space="preserve">         ...:..::::::::::::::::::::~~!!:..    .  .:..:~!~~!~~!!!!!!!!!!~.     </text>
      <text x="485" y="176.6" xml:space="preserve">               ..:::~:::~~~:~~~~~~~!!!!~~~...    .~~!!!~~!!~~~~~!!!!!!~       </text>
      <text x="485" y="186.8" xml:space="preserve">                    .~!!!!!!!!!7!7!!7?777!:.    ..::~~~!!!!7!!!!77777.        </text>
      <text x="485" y="197.0" xml:space="preserve">                      .:~!777777??7777~.:::   .:..... .:~~!7777777!~.         </text>
      <text x="485" y="207.2" xml:space="preserve">                          .:!!!!7!!~~:..~!~:::..        .~!7!!!7!~            </text>
      <text x="485" y="217.4" xml:space="preserve">                              ...::...:!!!~..       .....~!!~~...             </text>
      <text x="485" y="227.6" xml:space="preserve">                                 .~!!!77~::..:~~~:. .....:..                  </text>
      <text x="485" y="237.8" xml:space="preserve">                                 :777??77777777!~!77!!77!!.                   </text>
      <text x="485" y="248.0" xml:space="preserve">                                  .:~7?77!!~~~~:..!777777!.                   </text>
      <text x="485" y="258.2" xml:space="preserve">                                     .~!777~.   .:~!777!!~~                   </text>
      <text x="485" y="268.4" xml:space="preserve">                                       .:!!:.::.:~:!7~.::                     </text>
      <text x="485" y="278.6" xml:space="preserve">                                       ...~~::.::~77!..                       </text>
      <text x="485" y="288.8" xml:space="preserve">                                      :!..::..:~!7?~                          </text>
      <text x="485" y="299.0" xml:space="preserve">                                     .!!:..:::~!!7!:                          </text>
      <text x="485" y="309.2" xml:space="preserve">                                     :!~:.~~:~~!!~.                           </text>
      <text x="485" y="319.4" xml:space="preserve">                                     ~7!~~~::!!!7:    .                       </text>
      <text x="485" y="329.6" xml:space="preserve">                                     !77~:~~!!77:.   .:                       </text>
      <text x="485" y="339.8" xml:space="preserve">                                     !7:~~~!77!:.    ~:                       </text>
      <text x="485" y="350.0" xml:space="preserve">                                     ~~:~~!!7!.     .:                        </text>
      <text x="485" y="360.2" xml:space="preserve">                                   :~~..:~~~~:.     .                         </text>
      <text x="485" y="370.4" xml:space="preserve">                                  :~:~:. ::..:                                </text>
      <text x="485" y="380.6" xml:space="preserve">                                  ......       .                              </text>
      <text x="485" y="390.8" xml:space="preserve">                                   ...         .                              </text>
      <text x="485" y="401.0" xml:space="preserve">                                  .                                           </text>
    </g>
    <g class="ascii ascii-shimmer" fill="#FFFFFF">

    </g>
  </g>

  <!-- ==================== LEFT SIDE: REZTOKIA / ENGINEERING ECSTASY MANIFESTO ==================== -->
  <g transform="translate(64, 58)">
    <!-- Top Micro Tag -->
    <text x="0" y="0" fill="#71717A" font-size="10.5" font-weight="600" letter-spacing="2.8" class="mono">
      ARCHIVE // 002 — PHILOSOPHY OF CRAFT
    </text>

    <!-- "SEEK" Callout (Direct homage to Reference 2) -->
    <text x="0" y="128" fill="#A1A1AA" font-size="11.5" font-weight="600" letter-spacing="3.2" class="sans">
      SEEK
    </text>

    <!-- Main Poster Title -->
    <text x="-2" y="176" fill="#FFFFFF" font-size="38" font-weight="800" letter-spacing="-0.8" class="sans">
      CREATIVE ECSTASY
    </text>
    <text x="0" y="204" fill="#D4D4D8" font-size="11.5" font-weight="600" letter-spacing="2.2" class="mono">
      THE CONCEPT OF REZTOKIA IN SYSTEMS ENGINEERING
    </text>

    <!-- Editorial Dictionary Definition Paragraph -->
    <g transform="translate(0, 234)" fill="#A1A1AA" font-size="13" font-weight="400" class="sans">
      <text x="0" y="0"><tspan fill="#F4F4F5" font-weight="600">Reztokia (noun):</tspan> A state of creative ecstasy characterized</text>
      <text x="0" y="20">by an overwhelming rush of clarity, fulfillment, and pride</text>
      <text x="0" y="40">triggered when complex architecture clicks into effortless</text>
      <text x="0" y="60">human experience. That rare moment only achieved through</text>
      <text x="0" y="80">relentless iteration and obsession with the craft.</text>
    </g>

    <!-- 4 Engineering Pillars Below the Definition -->
    <g transform="translate(0, 344)" class="mono" font-size="11.5">
      <line x1="0" y1="-12" x2="410" y2="-12" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

      <text x="0" y="10" fill="#FFFFFF" font-weight="600">01 //</text>
      <text x="42" y="10" fill="#D4D4D8">AI agents woven into real human &amp; voice workflows</text>

      <text x="0" y="30" fill="#FFFFFF" font-weight="600">02 //</text>
      <text x="42" y="30" fill="#D4D4D8">Full-stack platforms with deep operator &amp; admin planes</text>

      <text x="0" y="50" fill="#FFFFFF" font-weight="600">03 //</text>
      <text x="42" y="50" fill="#D4D4D8">Expressive 3D companions, IDE plugins &amp; dev automation</text>

      <text x="0" y="70" fill="#71717A" font-size="10.5">
        * Production systems live in private repos; always open to deep-dives.
      </text>
    </g>
  </g>
</svg>
