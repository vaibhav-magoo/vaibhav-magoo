<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Deep OLED Surface -->
    <linearGradient id="oledSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#050507" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Top Specular Rim Light -->
    <linearGradient id="topRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Apple Titanium Display Text Gradient -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- Subtle Ambient Mesh Light -->
    <radialGradient id="ambientCyan" cx="78%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.11" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientWarm" cx="18%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Surface Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0C0C0F" />
    </linearGradient>

    <linearGradient id="cardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <pattern id="dotMatrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#FFFFFF" fill-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Plus Jakarta Sans', sans-serif;
    }
    .mono {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
    }

    @keyframes breatheLight {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes floatPrimary {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatSecondary {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes waveBar1 {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }
    @keyframes waveBar2 {
      0%, 100% { transform: scaleY(0.95); }
      50% { transform: scaleY(0.35); }
    }
    @keyframes waveBar3 {
      0%, 100% { transform: scaleY(0.6); }
      50% { transform: scaleY(0.9); }
    }

    .ambient-layer {
      transform-origin: 900px 140px;
      animation: breatheLight 9s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .card-primary {
      animation: floatPrimary 7s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .card-secondary {
      animation: floatSecondary 8s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .status-dot {
      animation: pulseDot 2.8s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .wb1 { transform-origin: center 14px; animation: waveBar1 1.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .wb2 { transform-origin: center 14px; animation: waveBar2 1.3s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .wb3 { transform-origin: center 14px; animation: waveBar3 1.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ambient-layer, .card-primary, .card-secondary, .status-dot, .wb1, .wb2, .wb3 {
        animation: none !important;
      }
    }
  </style>

  <!-- ==================== DOUBLE-BEZEL OUTER SHELL ==================== -->
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="#050507" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- ==================== DOUBLE-BEZEL INNER CORE ==================== -->
  <rect x="9" y="9" width="1182" height="342" rx="21" fill="url(#oledSurface)" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
  <rect x="9" y="9" width="1182" height="342" rx="21" fill="url(#dotMatrix)" />

  <!-- Ambient Lighting -->
  <rect x="9" y="9" width="1182" height="342" rx="21" fill="url(#ambientCyan)" class="ambient-layer" />
  <rect x="9" y="9" width="1182" height="342" rx="21" fill="url(#ambientWarm)" />

  <!-- Specular Top Hairline -->
  <line x1="80" y1="9.5" x2="1120" y2="9.5" stroke="url(#topRim)" stroke-width="1.2" />

  <!-- ==================== LEFT COLUMN: EDITORIAL TYPOGRAPHY ==================== -->
  <g transform="translate(64, 58)">
    <!-- Eyebrow Pill (Double Bezel Micro-Pill) -->
    <rect x="0" y="0" width="292" height="28" rx="14" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#10B981" class="status-dot" />
    <text x="30" y="18" fill="#A1A1AA" font-size="10.5" font-weight="600" letter-spacing="1.8" class="mono">
      FULL-STACK &amp; AI PRODUCT ENGINEER
    </text>

    <!-- Display Name (Negative Tracking, Tight Leading) -->
    <text x="-2" y="98" fill="url(#titaniumText)" font-size="60" font-weight="700" letter-spacing="-2.2" class="display">
      Vaibhav Magoo
    </text>

    <!-- Editorial Value Proposition -->
    <text x="0" y="140" fill="#A1A1AA" font-size="17.5" font-weight="400" letter-spacing="-0.2" class="display">
      Architecting <tspan fill="#F4F4F5" font-weight="500">campus-scale platforms</tspan>, <tspan fill="#F4F4F5" font-weight="500">voice AI workflows</tspan>, expressive
    </text>
    <text x="0" y="166" fill="#A1A1AA" font-size="17.5" font-weight="400" letter-spacing="-0.2" class="display">
      <tspan fill="#F4F4F5" font-weight="500">3D desktop companions</tspan>, and self-hosted developer infrastructure.
    </text>

    <!-- Nested "Button-in-Button" Island Pill + Domain Tags -->
    <g transform="translate(0, 206)">
      <!-- Primary Island Pill -->
      <rect x="0" y="0" width="194" height="40" rx="20" fill="#F4F4F5" />
      <text x="22" y="25" fill="#09090B" font-size="13" font-weight="600" letter-spacing="-0.2" class="display">
        Explore UniStack
      </text>
      <!-- Nested Circle Trailing Icon -->
      <circle cx="170" cy="20" r="14" fill="#09090B" fill-opacity="0.1" />
      <path d="M 166 24 L 174 16 M 168 16 L 174 16 L 174 22" fill="none" stroke="#09090B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Secondary Glass Pill -->
      <g transform="translate(208, 0)">
        <rect x="0" y="0" width="346" height="40" rx="20" fill="#111115" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
        <text x="20" y="24.5" fill="#71717A" font-size="12" font-weight="500" class="mono">
          Next.js · FastAPI · Three.js · Vapi · Docker
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: Z-AXIS HARDWARE TELEMETRY STACK ==================== -->
  <g transform="translate(720, 44)">

    <!-- Back Layer Card (Card 2: Verity & AI Workflows) -->
    <g class="card-secondary" transform="translate(34, 152)">
      <!-- Outer Shell -->
      <rect x="0" y="0" width="388" height="112" rx="20" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
      <!-- Inner Core -->
      <rect x="6" y="6" width="376" height="100" rx="15" fill="url(#glassCard)" stroke="url(#cardRim)" stroke-width="1" />

      <!-- Content -->
      <text x="26" y="32" fill="#71717A" font-size="10" font-weight="600" letter-spacing="1.5" class="mono">
        02 // 3D DESKTOP &amp; VOICE AI
      </text>
      <circle cx="354" cy="28" r="3.5" fill="#F59E0B" />

      <text x="26" y="58" fill="#F4F4F5" font-size="16" font-weight="600" letter-spacing="-0.3" class="display">
        Verity Companion &amp; UniStack AI
      </text>
      <text x="26" y="80" fill="#A1A1AA" font-size="12.5" class="display">
        700+ 3D expressions · Vapi voice agents · PPTX engine
      </text>

      <!-- Subtle Voice Waveform -->
      <g transform="translate(332, 62)" fill="#F59E0B">
        <rect x="0" y="2" width="3" height="18" rx="1.5" class="wb1" />
        <rect x="6" y="2" width="3" height="18" rx="1.5" class="wb2" />
        <rect x="12" y="2" width="3" height="18" rx="1.5" class="wb3" />
        <rect x="18" y="2" width="3" height="18" rx="1.5" class="wb1" />
      </g>
    </g>

    <!-- Front Layer Card (Card 1: Flagship UniStack.cc) -->
    <g class="card-primary" transform="translate(0, 12)">
      <!-- Soft Ambient Drop Shadow -->
      <rect x="8" y="14" width="388" height="132" rx="22" fill="#000000" fill-opacity="0.55" />
      <!-- Outer Shell -->
      <rect x="0" y="0" width="388" height="130" rx="22" fill="#0E0E12" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <!-- Inner Core -->
      <rect x="6" y="6" width="376" height="118" rx="17" fill="url(#glassCard)" stroke="url(#cardRim)" stroke-width="1" />
      <line x1="36" y1="6.5" x2="352" y2="6.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1" />

      <!-- Header Row -->
      <text x="26" y="34" fill="#38BDF8" font-size="10" font-weight="600" letter-spacing="1.5" class="mono">
        01 // FLAGSHIP PRODUCTION SYSTEM
      </text>
      <rect x="292" y="21" width="68" height="18" rx="9" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
      <text x="326" y="33" text-anchor="middle" fill="#7DD3FC" font-size="9.5" font-weight="600" class="mono">LIVE</text>

      <!-- Title & Description -->
      <text x="26" y="62" fill="#FFFFFF" font-size="18.5" font-weight="600" letter-spacing="-0.4" class="display">
        UniStack.cc — Campus OS
      </text>
      <text x="26" y="84" fill="#A1A1AA" font-size="12.5" class="display">
        Student utilities, cab sharing, QR event passes,
      </text>
      <text x="26" y="102" fill="#A1A1AA" font-size="12.5" class="display">
        club onboarding, forms &amp; academic calendars.
      </text>

      <!-- Minimal Vector Arrow in Nested Circle -->
      <circle cx="344" cy="88" r="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <path d="M 340 92 L 348 84 M 342 84 L 348 84 L 348 90" fill="none" stroke="#F4F4F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>
</svg>
